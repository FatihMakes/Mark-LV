# Private user-session routing: JARVIS uses analog directly, Spotify uses its own gain stage.
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=lacasa_spotify sink_properties=device.description=LaCasa_Spotify" flags = [ nofail ] }
    { cmd = "load-module" args = "module-loopback source=lacasa_spotify.monitor sink=alsa_output.pci-0000_00_1f.3.analog-stereo latency_msec=40" flags = [ nofail ] }
]
